<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>贪吃蛇</title>
  <style>
    :root{ color-scheme: light dark }
    body{ margin:0; display:grid; place-items:center; min-height:100vh; background:#f6f7f9; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif }
    .wrap{ text-align:center; padding:16px }
    h1{ margin:0 0 8px; font-size:22px }
    .toolbar{ display:flex; gap:12px; justify-content:center; align-items:center; margin-bottom:12px }
    .score{ font-weight:700 }
    button{ padding:8px 12px; border-radius:8px; border:1px solid #bbb; background:#fff; cursor:pointer }
    button:hover{ background:#f0f0f0 }
    canvas{ background:#111; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.08); touch-action:none }
    .pad{ display:grid; grid-template-columns:repeat(3,56px); gap:6px; justify-content:center; margin-top:10px }
    .pad button{ width:56px; height:56px; border-radius:10px; font-size:18px }
    a.back{ display:inline-block; margin-top:10px; color:#06c; text-decoration:none }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>贪吃蛇</h1>
    <div class="toolbar">
      <span>分数：<span class="score" id="score">0</span></span>
      <button id="new">重开</button>
      <button id="pause">暂停</button>
      <a class="back" href="index.html">返回目录</a>
    </div>
    <canvas id="c" width="480" height="480" aria-label="贪吃蛇"></canvas>
    <div class="pad">
      <span></span><button id="up">↑</button><span></span>
      <button id="left">←</button><span></span><button id="right">→</button>
      <span></span><button id="down">↓</button><span></span>
    </div>
  </div>
  <script>
    (function(){
      const GRID = 24; // 24x24
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const S = canvas.width / GRID;
      const scoreEl = document.getElementById('score');
      const newBtn = document.getElementById('new');
      const pauseBtn = document.getElementById('pause');
      const keyBtn = {up:document.getElementById('up'),down:document.getElementById('down'),left:document.getElementById('left'),right:document.getElementById('right')};

      let snake, dir, nextDir, food, score, timer, paused, over, speed;

      function init(){
        snake = [{x:12,y:12}];
        dir = {x:1,y:0}; nextDir = dir; score=0; paused=false; over=false; speed=120;
        placeFood();
        draw();
        start();
      }

      function start(){
        if(timer) clearInterval(timer);
        timer = setInterval(step, speed);
      }

      function placeFood(){
        while(true){
          const p = {x:Math.floor(Math.random()*GRID), y:Math.floor(Math.random()*GRID)};
          if(!snake.some(s=>s.x===p.x&&s.y===p.y)){ food=p; break; }
        }
      }

      function step(){
        if(paused || over) return;
        dir = nextDir;
        const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
        // wrap-around 可切换为撞墙死亡：如需撞墙，改为 if(head.x<0||head.y<0||head.x>=GRID||head.y>=GRID) over=true
        if(head.x<0) head.x=GRID-1; if(head.y<0) head.y=GRID-1; if(head.x>=GRID) head.x=0; if(head.y>=GRID) head.y=0;
        if(snake.some(s=>s.x===head.x&&s.y===head.y)) { over=true; draw(); return; }
        snake.unshift(head);
        if(head.x===food.x && head.y===food.y){ score+=10; speed=Math.max(60, speed-2); clearInterval(timer); timer=setInterval(step,speed); placeFood(); }
        else snake.pop();
        draw();
      }

      function draw(){
        ctx.fillStyle = '#111'; ctx.fillRect(0,0,canvas.width,canvas.height);
        // grid light
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 1;
        for(let i=1;i<GRID;i++){ ctx.beginPath(); ctx.moveTo(i*S,0); ctx.lineTo(i*S,canvas.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*S); ctx.lineTo(canvas.width,i*S); ctx.stroke(); }
        // food
        ctx.fillStyle = '#e74c3c'; roundRect(food.x*S+2, food.y*S+2, S-4, S-4, 6);
        // snake
        ctx.fillStyle = '#2ecc71';
        snake.forEach((p,i)=>{ roundRect(p.x*S+2, p.y*S+2, S-4, S-4, i?6:10); });
        scoreEl.textContent = score + (over?'（结束）': paused?'（暂停）':'');
        if(over){
          ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.fillStyle='#fff'; ctx.font='bold 28px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('游戏结束 - 点击重开', canvas.width/2, canvas.height/2);
        }
      }

      function roundRect(x,y,w,h,r){
        ctx.beginPath();
        ctx.moveTo(x+r,y);
        ctx.arcTo(x+w,y,x+w,y+h,r);
        ctx.arcTo(x+w,y+h,x,y+h,r);
        ctx.arcTo(x,y+h,x,y,r);
        ctx.arcTo(x,y,x+w,y,r);
        ctx.closePath(); ctx.fill();
      }

      function setDir(nx,ny){
        // 禁止 180 度掉头
        if(nx===-dir.x && ny===-dir.y) return;
        nextDir = {x:nx,y:ny};
      }

      window.addEventListener('keydown', e=>{
        const k=e.key; if(k==='ArrowLeft') setDir(-1,0); else if(k==='ArrowRight') setDir(1,0); else if(k==='ArrowUp') setDir(0,-1); else if(k==='ArrowDown') setDir(0,1);
        if(k===' '){ paused=!paused; }
      });

      // on-screen buttons
      keyBtn.up.onclick=()=>setDir(0,-1);
      keyBtn.down.onclick=()=>setDir(0,1);
      keyBtn.left.onclick=()=>setDir(-1,0);
      keyBtn.right.onclick=()=>setDir(1,0);

      canvas.addEventListener('click', ()=>{ if(over){ init(); }});
      newBtn.addEventListener('click', init);
      pauseBtn.addEventListener('click', ()=>{ paused=!paused; draw(); });

      init();
    })();
  </script>
</body>
</html>
