<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2048</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; display:grid; place-items:center; min-height:100vh; background:#f6f7f9; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,PingFang SC, Noto Sans CJK SC, Microsoft YaHei,sans-serif }
    .wrap{ text-align:center; padding:16px }
    h1{ margin:0 0 8px; font-size:22px }
    .toolbar{ display:flex; gap:12px; justify-content:center; align-items:center; margin-bottom:12px; flex-wrap:wrap }
    .score{ font-weight:700 }
    button{ padding:8px 12px; border-radius:8px; border:1px solid #bbb; background:#fff; cursor:pointer }
    button:hover{ background:#f0f0f0 }
    canvas{ background:#bbada0; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.08); touch-action: none }
    a.back{ display:inline-block; margin-top:10px; color:#06c; text-decoration:none }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>2048</h1>
    <div class="toolbar">
      <span>分数：<span class="score" id="score">0</span></span>
      <label>难度
        <select id="difficulty">
          <option value="easy">简单</option>
          <option value="normal" selected>普通</option>
          <option value="hard">困难</option>
        </select>
      </label>
      <button id="new">重开</button>
      <button id="rank">排行榜</button>
      <a class="back" href="index.html">返回目录</a>
    </div>
    <canvas id="c" width="440" height="440" aria-label="2048 棋盘"></canvas>
    <p>操作：方向键 或 触摸滑动</p>
  </div>
  <script src="lib/leaderboard.js"></script>
  <script>
    (function(){
      const N = 4;
      const SZ = 100, GAP = 12, PAD = 16;
      const W = PAD*2 + N*SZ + (N-1)*GAP;
      const canvas = document.getElementById('c');
      canvas.width = canvas.height = W;
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const newBtn = document.getElementById('new');
      const rankBtn = document.getElementById('rank');
      const diffSel = document.getElementById('difficulty');

      let board, score, over, diff, prob4;
      const colors = {
        0:'#cdc1b4', 2:'#eee4da', 4:'#ede0c8', 8:'#f2b179', 16:'#f59563', 32:'#f67c5f', 64:'#f65e3b',
        128:'#edcf72', 256:'#edcc61', 512:'#edc850', 1024:'#edc53f', 2048:'#edc22e'
      };
      const fontColor = v => v<=4 ? '#776e65' : '#f9f6f2';

      function init(){
        board = Array.from({length:N}, () => Array(N).fill(0));
        score = 0; over = false;
        diff = diffSel.value;
        prob4 = (diff==='easy'?0.1: diff==='normal'?0.2: 0.35);
        addTile(); addTile();
        draw();
      }

      function addTile(){
        const empty = [];
        for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(!board[r][c]) empty.push([r,c]);
        if(!empty.length) return false;
        let [r,c];
        if(diff==='hard'){
          // simple "evil" spawn: choose cell that minimizes immediate merges
          let best=null, bestScore=Infinity;
          for(const cell of empty){
            const s = neighborMergePotential(cell[0],cell[1]);
            if(s<bestScore){ bestScore=s; best=cell; }
          }
          [r,c] = best;
        } else {
          [r,c] = empty[Math.floor(Math.random()*empty.length)];
        }
        board[r][c] = Math.random()<prob4 ? 4 : 2;
        return true;
      }

      function neighborMergePotential(r,c){
        const v2=2, v4=4;
        let s=0;
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{
          const rr=r+dr, cc=c+dc; if(rr>=0&&rr<N&&cc>=0&&cc<N){ const v=board[rr][cc]; if(v===v2||v===v4) s++; }
        });
        return s;
      }

      function draw(){
        ctx.clearRect(0,0,W,W);
        // bg
        ctx.fillStyle = '#bbada0';
        ctx.fillRect(0,0,W,W);
        for(let r=0;r<N;r++){
          for(let c=0;c<N;c++){
            const x = PAD + c*(SZ+GAP);
            const y = PAD + r*(SZ+GAP);
            const v = board[r][c];
            ctx.fillStyle = colors[v]||'#3c3a32';
            roundRect(ctx,x,y,SZ,SZ,10);
            if(v){
              ctx.fillStyle = fontColor(v);
              const fs = v<100?48:v<1000?42:34;
              ctx.font = `bold ${fs}px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial`;
              ctx.textAlign='center'; ctx.textBaseline='middle';
              ctx.fillText(v, x+SZ/2, y+SZ/2);
            }
          }
        }
        scoreEl.textContent = score;
        if(over){
          ctx.fillStyle = 'rgba(0,0,0,.4)';
          ctx.fillRect(0,0,W,W);
          ctx.fillStyle = '#fff'; ctx.font='bold 32px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('游戏结束', W/2, W/2 - 12);
          ctx.font='16px system-ui'; ctx.fillText('点击重开', W/2, W/2 + 18);
        }
      }

      function roundRect(ctx,x,y,w,h,r){
        ctx.beginPath();
        ctx.moveTo(x+r,y);
        ctx.arcTo(x+w,y,x+w,y+h,r);
        ctx.arcTo(x+w,y+h,x,y+h,r);
        ctx.arcTo(x,y+h,x,y,r);
        ctx.arcTo(x,y,x+w,y,r);
        ctx.closePath();
        ctx.fill();
      }

      function slideRowLeft(row){
        const arr = row.filter(v=>v);
        for(let i=0;i<arr.length-1;i++){
          if(arr[i]===arr[i+1]){ arr[i]*=2; score+=arr[i]; arr[i+1]=0; i++; }
        }
        return arr.filter(v=>v).concat(Array(N-arr.filter(v=>v).length).fill(0));
      }

      function rotateClockwise(b){
        const m = Array.from({length:N},()=>Array(N).fill(0));
        for(let r=0;r<N;r++) for(let c=0;c<N;c++) m[c][N-1-r]=b[r][c];
        return m;
      }

      function doMove(dir){
        if(over) return false;
        let moved=false;
        let work = board.map(r=>r.slice());
        // dir: 0=left,1=up,2=right,3=down
        for(let k=0;k<dir;k++) work = rotateClockwise(work);
        const after = work.map(slideRowLeft);
        for(let k=0;k<(4-dir)%4;k++) work = rotateClockwise(after);
        for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(board[r][c]!==work[r][c]) moved=true;
        if(moved){ board = work; addTile(); if(!canMove()) { over=true; onGameOver(); } draw(); }
        return moved;
      }

      function canMove(){
        for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(!board[r][c]) return true;
        for(let r=0;r<N;r++) for(let c=0;c<N-1;c++) if(board[r][c]===board[r][c+1]) return true;
        for(let r=0;r<N-1;r++) for(let c=0;c<N;c++) if(board[r][c]===board[r+1][c]) return true;
        return false;
      }

      // Input
      window.addEventListener('keydown', e=>{
        const map = {ArrowLeft:0, ArrowUp:1, ArrowRight:2, ArrowDown:3};
        if(map[e.key]!==undefined){ e.preventDefault(); doMove(map[e.key]); }
      }, {passive:false});

      // touch swipe
      let sx=0, sy=0;
      canvas.addEventListener('touchstart', e=>{ if(e.touches[0]){sx=e.touches[0].clientX; sy=e.touches[0].clientY;}}, {passive:true});
      canvas.addEventListener('touchend', e=>{
        const t=e.changedTouches[0]; if(!t) return; const dx=t.clientX-sx, dy=t.clientY-sy;
        if(Math.hypot(dx,dy)<24) return; const adx=Math.abs(dx), ady=Math.abs(dy);
        if(adx>ady) doMove(dx<0?0:2); else doMove(dy<0?1:3);
      }, {passive:true});

      function onGameOver(){
        // record score to leaderboard
        LB.record({key:'2048', difficulty: diffSel.value, score, better:'desc', unit:'分'});
      }

      newBtn.addEventListener('click', init);
      diffSel.addEventListener('change', init);
      rankBtn.addEventListener('click', ()=> LB.show({key:'2048', difficulty: diffSel.value, better:'desc', unit:'分', title:'2048 排行榜'}));
      canvas.addEventListener('click', ()=>{ if(over) init(); });

      init();
    })();
  </script>
</body>
</html>
