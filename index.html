<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小游戏合集</title>
  <meta name="description" content="小游戏合集：五子棋、2048、贪吃蛇、打砖块。">
  <style>
    :root { 
      color-scheme: light dark;
      --bg-color: #f6f7f9;
      --card-bg: #fff;
      --text-color: #333;
      --text-muted: #666;
      --border-color: #ddd;
      --shadow: rgba(0,0,0,.08);
      --hover-shadow: rgba(0,0,0,.12);
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1a1a1a;
        --card-bg: #2d2d2d;
        --text-color: #fff;
        --text-muted: #aaa;
        --border-color: #444;
        --shadow: rgba(0,0,0,.2);
        --hover-shadow: rgba(0,0,0,.3);
      }
    }
    
    * { box-sizing: border-box; }
    
    body { 
      margin:0; 
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif; 
      background: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    header { 
      text-align:center; 
      padding: clamp(24px, 5vw, 40px) 16px 16px; 
    }
    
    h1 { 
      margin:0 0 12px; 
      font-size: clamp(24px, 5vw, 32px); 
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    p.desc { 
      margin:0; 
      color: var(--text-muted); 
      font-size: 16px;
    }
    
    main { 
      max-width: 1000px; 
      margin: 0 auto; 
      padding: 20px 16px 40px; 
    }
    
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); 
      gap: clamp(12px, 3vw, 20px); 
    }
    
    .card { 
      display: block; 
      padding: 20px; 
      border-radius: 16px; 
      background: var(--card-bg); 
      border: 1px solid var(--border-color); 
      text-decoration: none; 
      color: inherit; 
      transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px var(--shadow);
      position: relative;
      overflow: hidden;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transform: scaleX(0);
      transition: transform .2s ease;
    }
    
    .card:hover, .card:focus { 
      transform: translateY(-4px); 
      box-shadow: 0 12px 32px var(--hover-shadow);
      border-color: transparent;
    }
    
    .card:hover::before {
      transform: scaleX(1);
    }
    
    .card:active {
      transform: translateY(-2px);
      transition: transform .1s ease;
    }
    
    .card h3 { 
      margin: 0 0 8px; 
      font-size: 20px; 
      font-weight: 600;
    }
    
    .card p { 
      margin: 0; 
      color: var(--text-muted); 
      font-size: 15px; 
      line-height: 1.4;
    }
    
    footer { 
      text-align: center; 
      padding: 32px 16px; 
      color: var(--text-muted); 
      font-size: 14px;
      border-top: 1px solid var(--border-color);
      margin-top: 40px;
    }
    
    /* 移动端优化 */
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      
      .card {
        padding: 18px;
        border-radius: 12px;
      }
      
      .card h3 {
        font-size: 18px;
      }
      
      .card p {
        font-size: 14px;
      }
      
      header {
        padding: 20px 16px 12px;
      }
      
      main {
        padding: 16px 12px 32px;
      }
    }
    
    @media (max-width: 480px) {
      .card {
        padding: 16px;
        margin: 0 4px;
      }
      
      main {
        padding: 16px 8px 24px;
      }
    }
    
    /* 触摸优化 */
    @media (hover: none) and (pointer: coarse) {
      .card {
        min-height: 44px;
        touch-action: manipulation;
      }
      
      .card:hover {
        transform: none;
        box-shadow: 0 2px 8px var(--shadow);
      }
      
      .card:active {
        transform: scale(0.98);
        background: var(--card-bg);
        filter: brightness(0.95);
      }
    }
    
    /* 无障碍优化 */
    @media (prefers-reduced-motion: reduce) {
      .card {
        transition: box-shadow .2s ease;
      }
      
      .card:hover {
        transform: none;
      }
      
      .card::before {
        transition: none;
      }
    }
  </style>
  <link rel="icon" href="data:,">
</head>
<body>
  <header>
    <h1>小游戏合集</h1>
    <p class="desc">点击选择游戏开始游玩</p>
  </header>
  <main>
    <div class="grid">
      <a class="card" href="gomoku.html">
        <h3>五子棋</h3>
        <p>15x15，人机/双人对战。</p>
      </a>
      <a class="card" href="2048.html">
        <h3>2048</h3>
        <p>方向键或滑动操作，合并数字至 2048。</p>
      </a>
      <a class="card" href="snake.html">
        <h3>贪吃蛇</h3>
        <p>方向键控制，撞墙或自撞即结束。</p>
      </a>
      <a class="card" href="breakout.html">
        <h3>打砖块</h3>
        <p>左右方向键或鼠标移动挡板，打掉砖块。</p>
      </a>
      <a class="card" href="minesweeper.html">
        <h3>扫雷</h3>
        <p>入门/中级/高级，计时挑战。</p>
      </a>
      <a class="card" href="memory.html">
        <h3>记忆配对</h3>
        <p>翻牌找对，支持多种难度与排行榜。</p>
      </a>
    </div>
  </main>
  <footer>提示：如在手机上，优先横屏体验更佳。</footer>
</body>
</html>
