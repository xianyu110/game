<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小游戏合集</title>
  <meta name="description" content="小游戏合集：五子棋、2048、贪吃蛇、打砖块。">
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif; background:#f6f7f9; }
    header { text-align:center; padding:32px 16px 8px; }
    h1 { margin:0 0 8px; font-size:24px; }
    p.desc { margin:0; color:#666; }
    main { max-width:900px; margin:24px auto; padding:0 16px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
    .card { display:block; padding:16px; border-radius:12px; background:#fff; border:1px solid #ddd; text-decoration:none; color:inherit; transition:transform .1s ease, box-shadow .1s ease; }
    .card:hover { transform: translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.08); }
    .card h3 { margin:0 0 8px; font-size:18px; }
    .card p { margin:0; color:#666; font-size:14px; }
    footer { text-align:center; padding:24px; color:#777; font-size:12px; }
  </style>
  <link rel="icon" href="data:,">
</head>
<body>
  <header>
    <h1>小游戏合集</h1>
    <p class="desc">点击选择游戏开始游玩</p>
  </header>
  <main>
    <div class="grid">
      <a class="card" href="gomoku.html">
        <h3>五子棋</h3>
        <p>15x15，人机/双人对战。</p>
      </a>
      <a class="card" href="2048.html">
        <h3>2048</h3>
        <p>方向键或滑动操作，合并数字至 2048。</p>
      </a>
      <a class="card" href="snake.html">
        <h3>贪吃蛇</h3>
        <p>方向键控制，撞墙或自撞即结束。</p>
      </a>
      <a class="card" href="breakout.html">
        <h3>打砖块</h3>
        <p>左右方向键或鼠标移动挡板，打掉砖块。</p>
      </a>
    </div>
  </main>
  <footer>提示：如在手机上，优先横屏体验更佳。</footer>
</body>
</html>
