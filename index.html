<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>小游戏合集</title>
  <meta name="description" content="小游戏合集：五子棋、2048、贪吃蛇、打砖块。">
  
  <!-- PWA优化 -->
  <meta name="theme-color" content="#667eea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2d2d2d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小游戏合集">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- 防止数字被识别为电话号码 -->
  <meta name="format-detection" content="telephone=no">
  
  <!-- 优化搜索引擎 -->
  <meta name="keywords" content="小游戏,五子棋,2048,贪吃蛇,打砖块,扫雷,记忆配对,在线游戏">
  <meta name="author" content="Game Collection">
  <meta property="og:title" content="小游戏合集">
  <meta property="og:description" content="精选小游戏合集，包含五子棋、2048、贪吃蛇等经典游戏">
  <meta property="og:type" content="website">
  <style>
    :root { 
      color-scheme: light dark;
      --bg-color: #f6f7f9;
      --card-bg: #fff;
      --text-color: #333;
      --text-muted: #666;
      --border-color: #ddd;
      --shadow: rgba(0,0,0,.08);
      --hover-shadow: rgba(0,0,0,.12);
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1a1a1a;
        --card-bg: #2d2d2d;
        --text-color: #fff;
        --text-muted: #aaa;
        --border-color: #444;
        --shadow: rgba(0,0,0,.2);
        --hover-shadow: rgba(0,0,0,.3);
      }
    }
    
    * { box-sizing: border-box; }
    
    body { 
      margin:0; 
      font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif; 
      background: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    header { 
      text-align:center; 
      padding: clamp(24px, 5vw, 40px) 16px 16px; 
    }
    
    h1 { 
      margin:0 0 12px; 
      font-size: clamp(24px, 5vw, 32px); 
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    p.desc { 
      margin:0; 
      color: var(--text-muted); 
      font-size: 16px;
    }
    
    main { 
      max-width: 1000px; 
      margin: 0 auto; 
      padding: 20px 16px 40px; 
    }
    
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); 
      gap: clamp(12px, 3vw, 20px); 
    }
    
    .card { 
      display: block; 
      padding: 20px; 
      border-radius: 16px; 
      background: var(--card-bg); 
      border: 1px solid var(--border-color); 
      text-decoration: none; 
      color: inherit; 
      transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px var(--shadow);
      position: relative;
      overflow: hidden;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transform: scaleX(0);
      transition: transform .2s ease;
    }
    
    .card:hover, .card:focus { 
      transform: translateY(-4px); 
      box-shadow: 0 12px 32px var(--hover-shadow);
      border-color: transparent;
    }
    
    .card:hover::before {
      transform: scaleX(1);
    }
    
    .card:active {
      transform: translateY(-2px);
      transition: transform .1s ease;
    }
    
    .card h3 { 
      margin: 0 0 8px; 
      font-size: 20px; 
      font-weight: 600;
    }
    
    .card p { 
      margin: 0; 
      color: var(--text-muted); 
      font-size: 15px; 
      line-height: 1.4;
    }
    
    footer { 
      text-align: center; 
      padding: 32px 16px; 
      color: var(--text-muted); 
      font-size: 14px;
      border-top: 1px solid var(--border-color);
      margin-top: 40px;
    }
    
    /* 移动端优化 */
    @media (max-width: 768px) {
      body {
        font-size: 16px; /* 防止iOS Safari自动缩放 */
        -webkit-text-size-adjust: 100%;
      }
      
      .grid {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 0 4px;
      }
      
      .card {
        padding: 24px 20px;
        border-radius: 16px;
        margin: 0 8px;
        box-shadow: 0 4px 16px var(--shadow);
        min-height: 88px; /* 更大的触摸区域 */
      }
      
      .card h3 {
        font-size: 20px;
        margin-bottom: 12px;
      }
      
      .card p {
        font-size: 15px;
        line-height: 1.5;
      }
      
      header {
        padding: 24px 20px 16px;
      }
      
      h1 {
        font-size: 28px;
        margin-bottom: 16px;
      }
      
      p.desc {
        font-size: 17px;
      }
      
      main {
        padding: 20px 16px 40px;
      }
      
      footer {
        padding: 40px 20px;
        font-size: 15px;
      }
    }
    
    @media (max-width: 480px) {
      .grid {
        gap: 16px;
        padding: 0 2px;
      }
      
      .card {
        padding: 20px 18px;
        margin: 0 6px;
        border-radius: 14px;
        min-height: 80px;
      }
      
      .card h3 {
        font-size: 19px;
      }
      
      .card p {
        font-size: 14px;
      }
      
      header {
        padding: 20px 16px 12px;
      }
      
      h1 {
        font-size: 26px;
      }
      
      p.desc {
        font-size: 16px;
      }
      
      main {
        padding: 16px 12px 32px;
      }
      
      footer {
        padding: 32px 16px;
        font-size: 14px;
      }
    }
    
    @media (max-width: 380px) {
      .card {
        margin: 0 4px;
        padding: 18px 16px;
        min-height: 76px;
      }
      
      .card h3 {
        font-size: 18px;
      }
      
      .card p {
        font-size: 14px;
      }
      
      main {
        padding: 12px 8px 24px;
      }
      
      header {
        padding: 16px 12px 8px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      p.desc {
        font-size: 15px;
      }
    }
    
    /* 触摸设备优化 */
    @media (hover: none) and (pointer: coarse) {
      .card {
        min-height: 56px; /* Apple建议的最小触摸区域 */
        touch-action: manipulation;
        -webkit-touch-callout: none; /* 禁用长按菜单 */
        -webkit-user-select: none;
        user-select: none;
      }
      
      .card:hover {
        transform: none;
        box-shadow: 0 4px 16px var(--shadow);
      }
      
      .card:active {
        transform: scale(0.97);
        box-shadow: 0 2px 8px var(--shadow);
        transition: all 0.1s ease;
      }
      
      /* 提供视觉反馈 */
      .card::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--text-color);
        opacity: 0;
        transition: opacity 0.1s ease;
        pointer-events: none;
        border-radius: inherit;
      }
      
      .card:active::after {
        opacity: 0.05;
      }
    }
    
    /* PWA和全屏优化 */
    @media (display-mode: standalone) {
      header {
        padding-top: max(24px, env(safe-area-inset-top));
      }
      
      footer {
        padding-bottom: max(32px, env(safe-area-inset-bottom));
      }
    }
    
    /* 横屏移动设备优化 */
    @media (max-width: 768px) and (orientation: landscape) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
      
      .card {
        padding: 16px 18px;
        min-height: 60px;
      }
      
      .card h3 {
        font-size: 17px;
        margin-bottom: 6px;
      }
      
      .card p {
        font-size: 13px;
        line-height: 1.4;
      }
      
      header {
        padding: 16px 20px 12px;
      }
      
      h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }
      
      p.desc {
        font-size: 15px;
      }
      
      main {
        padding: 12px 16px 24px;
      }
    }
    
    /* 无障碍优化 */
    @media (prefers-reduced-motion: reduce) {
      .card {
        transition: box-shadow .2s ease;
      }
      
      .card:hover {
        transform: none;
      }
      
      .card::before {
        transition: none;
      }
    }
  </style>
  <link rel="icon" href="data:,">
</head>
<body>
  <header>
    <h1>小游戏合集</h1>
    <p class="desc">点击选择游戏开始游玩</p>
  </header>
  <main>
    <div class="grid">
      <a class="card" href="gomoku.html">
        <h3>五子棋</h3>
        <p>15x15，人机/双人对战。</p>
      </a>
      <a class="card" href="2048.html">
        <h3>2048</h3>
        <p>方向键或滑动操作，合并数字至 2048。</p>
      </a>
      <a class="card" href="snake.html">
        <h3>贪吃蛇</h3>
        <p>方向键控制，撞墙或自撞即结束。</p>
      </a>
      <a class="card" href="breakout.html">
        <h3>打砖块</h3>
        <p>左右方向键或鼠标移动挡板，打掉砖块。</p>
      </a>
      <a class="card" href="minesweeper.html">
        <h3>扫雷</h3>
        <p>入门/中级/高级，计时挑战。</p>
      </a>
      <a class="card" href="memory.html">
        <h3>记忆配对</h3>
        <p>翻牌找对，支持多种难度与排行榜。</p>
      </a>
    </div>
  </main>
  <footer>提示：如在手机上，优先横屏体验更佳。</footer>
</body>
</html>
